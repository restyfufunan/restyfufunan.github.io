{% assign pub_title = post.title | markdownify | remove: "<p>" | remove: "</p>" | strip %}
<li>
  {% if post.paperurl %}
    <a href="{{ post.paperurl }}">{{ pub_title }}</a>
  {% else %}
    {{ pub_title }}
  {% endif %}
  {% if post.venue %}&mdash; <em>{{ post.venue }}</em>{% endif %}
  {% if post.date %}, {{ post.date | date: "%Y" }}{% endif %}
</li>
