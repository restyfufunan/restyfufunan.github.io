# Basic Site Settings
locale                   : "en-US"
site_theme               : "default"
title                    : "YOUR NAME"
title_separator          : "-"
name                     : &name "YOUR NAME"
description              : &description "YOUR NAME — [FIELD] at [INSTITUTION]"
url                      : https://restyfufunan.github.io
baseurl                  : ""
repository               : "restyfufunan/restyfufunan.github.io"

# Site Author
# Controls what appears in the sidebar. Leave a field blank to hide it.
author:
  avatar           : "profile.png"           # filename in /images/
  name             : "YOUR NAME"
  pronouns         :                          # e.g., "she/her"
  bio              : "PhD Candidate in [FIELD] at [INSTITUTION]. I study [RESEARCH INTERESTS]."
  location         : "CITY, STATE"
  employer         : "YOUR INSTITUTION"
  uri              :                          # personal website other than this one
  email            : "yourname@university.edu"

  # Academic profiles
  googlescholar    :                          # https://scholar.google.com/citations?user=XXXX
  orcid            :                          # https://orcid.org/XXXX
  ssrn             :                          # https://ssrn.com/author=XXXX

  # Code / software
  github           : "YOUR_GITHUB_USERNAME"

  # Social media — fill in whichever you use, leave others blank
  bluesky          :                          # yourhandle.bsky.social
  twitter          :                          # YOUR_TWITTER_HANDLE
  linkedin         :                          # YOUR_LINKEDIN_USERNAME

# Publication Categories
# These control section headings on the Research page (in this order).
publication_category:
  manuscripts:
    title: 'Published'
  working_papers:
    title: 'Working Papers'
  in_progress:
    title: 'Works in Progress'

# Site Settings
teaser                   :
breadcrumbs              : false
words_per_minute         : 160
future                   : true
read_more                : "disabled"
talkmap_link             : false
comments:
  provider               :
atom_feed:
  hide                   : false

# SEO
google_site_verification :
bing_site_verification   :

# Analytics
analytics:
  provider               : "false"
  google:
    tracking_id          :

# Reading Files
include:
  - .htaccess
  - _pages
  - files
exclude:
  - "*.sublime-project"
  - "*.sublime-workspace"
  - .asset-cache
  - .bundle
  - .github
  - .jekyll-assets-cache
  - .sass-cache
  - assets/js/_main.js
  - assets/js/plugins
  - assets/js/vendor
  - CHANGELOG
  - Capfile
  - config
  - Dockerfile
  - Gemfile
  - Gruntfile.js
  - gulpfile.js
  - LICENSE
  - local
  - log
  - node_modules
  - package.json*
  - Rakefile
  - README
  - tmp
  - vendor
keep_files:
  - .git
  - .svn
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"

# Conversion
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

# Markdown Processing
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false

# Collections
collections:
  publications:
    output: true
    permalink: /:collection/:path/

# Defaults
defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
  - scope:
      path: ""
      type: publications
    values:
      layout: single
      author_profile: true
      share: false
      comments: false

# Sass/SCSS
sass:
  sass_dir: _sass
  style: compressed

# Outputting
permalink: /:categories/:title/
timezone: Etc/UTC

# Plugins
plugins:
  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji

whitelist:
  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji

# Archives
category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/

# HTML Compression
compress_html:
  clippings: all
  ignore:
    envs: development
